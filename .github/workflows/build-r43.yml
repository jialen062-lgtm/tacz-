
name: Build TACZYIGF r43

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source ZIP
        run: |
          unzip -q tacz_cnpc_alert-r43-source.zip -d source
          test -f source/build.gradle
          test -f source/settings.gradle

      - name: Build mod
        working-directory: source
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r43
          path: source/build/libs/*.jar
          if-no-files-found: error
