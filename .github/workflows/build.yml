
name: Tactical Spectator Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted-source

          mapfile -t ZIPS < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './.git/*'
          )

          echo "ZIP files found:"
          printf '%s\n' "${ZIPS[@]}"

          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No ZIP found. Checking repository for Gradle project..."
          elif [ ${#ZIPS[@]} -gt 1 ]; then
            echo "Multiple ZIP files found:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          else
            unzip -q "${ZIPS[0]}" -d extracted-source
          fi

          echo "===== Repository and extracted files ====="
          find . -maxdepth 5 -type f | head -200

      - name: Locate and build project
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find . \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle project found."
            echo "===== Repository contents ====="
            find . -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Gradle project found: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-build
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 30
