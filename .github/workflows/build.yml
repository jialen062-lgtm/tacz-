
name: Tactical Spectator Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tactical Spectator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Tactical Spectator source
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="TacticalSpectator_no_signal_tablet_stage.zip"

          echo "Selected source:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Selected source ZIP does not exist."
            echo "Expected: $SOURCE_ZIP"
            exit 1
          fi

          mkdir -p extracted-source

          unzip -q "$SOURCE_ZIP" -d extracted-source

          echo "===== Extracted source files ====="
          find extracted-source -type f | head -200

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find extracted-source \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found in source ZIP."
            echo "===== Extracted ZIP contents ====="
            find extracted-source -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Gradle file found:"
          echo "$BUILD_FILE"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Forge Mod
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          echo "Building project:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-JAR
          path: extracted-source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tactical-Spectator-Logs
          path: |
            extracted-source/**/build/reports/
            extracted-source/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 30
