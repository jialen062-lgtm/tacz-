
name: Tactical Spectator Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="TACZYIGF-r50-final-preview-fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted-source
          unzip -q "$ZIP_FILE" -d extracted-source

          echo "===== Extracted source files ====="
          find extracted-source -maxdepth 4 -type f | head -100

      - name: Locate and build Gradle project
        shell: bash
        run: |
          set -e

          mapfile -t BUILD_FILES < <(
            find extracted-source -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*"
          )

          if [ ${#BUILD_FILES[@]} -eq 0 ]; then
            echo "ERROR: No Gradle build file found inside source ZIP."
            echo "The ZIP may not contain the actual mod source project."
            echo "===== ZIP CONTENTS ====="
            find extracted-source -type f | head -200
            exit 1
          fi

          echo "Found Gradle files:"
          printf '%s\n' "${BUILD_FILES[@]}"

          PROJECT_DIR="$(dirname "${BUILD_FILES[0]}")"
          cd "$PROJECT_DIR"

          echo "Building project at: $PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-build
          path: extracted-source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
