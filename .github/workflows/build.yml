
name: Tactical Spectator Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew
        if: hashFiles('gradlew') != ''

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
