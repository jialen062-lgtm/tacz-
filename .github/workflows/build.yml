
name: Build CopyBlock Forge 1.20.1

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CopyBlock Mod
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库源码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安装 Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Gradle 8.8
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 4. 检查项目文件
      - name: Verify Project Structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f build.gradle
          test -f settings.gradle
          test -f src/main/resources/META-INF/mods.toml

          echo "Checking Forge version..."
          grep -q '1.20.1-47.4.10' build.gradle

          echo "Checking mod ID..."
          grep -q 'modId="copyblock"' \
            src/main/resources/META-INF/mods.toml

          echo "Project verification passed."

      # 5. 检查 Java 环境
      - name: Check Java Version
        run: |
          java -version
          gradle --version

      # 6. 编译 Forge 模组
      - name: Build Forge Mod
        run: |
          gradle clean build \
            --no-daemon \
            --stacktrace

      # 7. 检查 JAR 文件
      - name: Verify Build Output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/verified

          JAR=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: JAR not found!"
            exit 1
          fi

          echo "Found JAR: $JAR"

          jar tf "$JAR" > build/verified/jar_contents.txt

          grep -q 'CopyBlockMod.class' \
            build/verified/jar_contents.txt

          echo "JAR verification passed."

      # 8. 上传最终模组
      - name: Upload CopyBlock Mod
        uses: actions/upload-artifact@v4
        with:
          name: CopyBlock-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # 9. 上传编译报告
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopyBlock-Build-Reports
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 30
