
name: Build taczgz

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build taczgz
        run: gradle --no-daemon -p taczgz clean build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: taczgz-1.20.1-Forge-47.2.0
          path: taczgz/build/libs/*.jar
          if-no-files-found: error
