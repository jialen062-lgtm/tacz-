
name: JR FakePlayer Forge Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build JR FakePlayer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Locate JR FakePlayer source
        shell: bash
        run: |
          set -eu

          echo "===== Repository files ====="
          find . -maxdepth 3 -type f | head -200

          mkdir -p workspace

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -iname '*JR_FakePlayer*.zip' \
            -print -quit || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Found source ZIP: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d workspace
          fi

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -d "$DIR/src/main/java" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(
            find . workspace -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              2>/dev/null || true
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::JR FakePlayer Gradle project not found"
            find . -maxdepth 6 -type f
            exit 1
          fi

          echo "Selected project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"

          echo "===== Project ====="
          pwd
          ls -la

          test -f build.gradle || test -f build.gradle.kts
          test -d src/main/java

          echo "Project structure OK"

      - name: Build Forge mod
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"

          gradle clean build \
            --no-daemon \
            --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"

          mkdir -p verified

          find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} verified/ \;

          if [ -z "$(find verified -name '*.jar' -print -quit)" ]; then
            echo "::error::No JAR generated"
            exit 1
          fi

          echo "===== Generated JAR ====="
          ls -lh verified

      - name: Upload JR FakePlayer JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Forge-1.20.1
          path: ${{ env.PROJECT_DIR }}/verified/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Failure-Logs
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/logs/**
          if-no-files-found: ignore
          retention-days: 30
