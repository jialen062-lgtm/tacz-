
name: Tactical Spectator R8 Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tactical Spectator R8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Locate and extract R8 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TacticalSpectator_R8_body_anchor_fix_source.zip"

          if [ -f "$ZIP" ]; then
            mkdir -p r8-extracted
            unzip -oq "$ZIP" -d r8-extracted
            SOURCE_DIR="r8-extracted/r7fix"

          elif [ -f "r7fix/build.gradle" ]; then
            SOURCE_DIR="r7fix"

          elif [ -f "build.gradle" ]; then
            SOURCE_DIR="."

          else
            echo "::error::R8 source not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          test -f "$SOURCE_DIR/build.gradle"
          test -f "$SOURCE_DIR/settings.gradle"
          test -f "$SOURCE_DIR/src/main/resources/META-INF/mods.toml"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "R8 source located: $SOURCE_DIR"

      - name: Verify mod identity
        shell: bash
        run: |
          set -euo pipefail

          MODS="$SOURCE_DIR/src/main/resources/META-INF/mods.toml"

          if ! grep -q 'modId="tactical_spectator"' "$MODS"; then
            echo "::error::Wrong mod identity"
            exit 1
          fi

          echo "Tactical Spectator identity verified"

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build R8 Forge mod
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          gradle clean build \
            --no-daemon \
            --stacktrace

      - name: Verify generated JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SOURCE_DIR/verified"

          find "$SOURCE_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} "$SOURCE_DIR/verified/" \;

          if [ -z "$(find "$SOURCE_DIR/verified" -name '*.jar' -print -quit)" ]; then
            echo "::error::No JAR generated"
            exit 1
          fi

          echo "===== R8 JAR ====="
          ls -lh "$SOURCE_DIR/verified"

      - name: Upload Tactical Spectator R8 JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-Spectator-R8-Forge-1.20.1
          path: ${{ env.SOURCE_DIR }}/verified/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-Spectator-R8-Failure-Reports
          path: |
            r8-extracted/**/build/reports/**
            r8-extracted/**/build/test-results/**
            r8-extracted/**/build/logs/**
          if-no-files-found: ignore
          retention-days: 30
