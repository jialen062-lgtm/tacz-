      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 3 -type f -iname "*.zip" \
              -not -path "./.git/*"
          )

          echo "Found ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "===== Repository contents ====="
            find . -maxdepth 4 -type f
            exit 1
          fi

          if [ ${#ZIP_FILES[@]} -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found."
            echo "Please keep only the source ZIP or specify the correct file."
            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[0]}"
          echo "Using source: $SOURCE_ZIP"

          mkdir -p extracted-source
          unzip -q "$SOURCE_ZIP" -d extracted-source

          echo "===== Extracted files ====="
          find extracted-source -maxdepth 5 -type f | head -200
