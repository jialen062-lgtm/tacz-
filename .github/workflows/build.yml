
name: Tactical Spectator Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tactical Spectator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract Tactical Spectator source
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="TacticalSpectator_no_signal_tablet_stage.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found: $SOURCE_ZIP"
            exit 1
          fi

          mkdir -p extracted-source
          unzip -q "$SOURCE_ZIP" -d extracted-source

          echo "===== Source files ====="
          find extracted-source -maxdepth 4 -type f | head -200

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find extracted-source \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found."
            find extracted-source -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Forge Mod with Gradle 8.8
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          echo "Building: $PROJECT_DIR"
          echo "Gradle version:"
          gradle --version

          cd "$PROJECT_DIR"

          gradle build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-JAR
          path: extracted-source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tactical-Spectator-Reports
          path: |
            extracted-source/**/build/reports/
            extracted-source/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 30
