
name: JR FakePlayer Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JR FakePlayer (Forge 1.20.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JR FakePlayer repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail

          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java

          if grep -R -q "tactical_spectator" src/main/java; then
            echo "::error::Tactical Spectator source detected. Wrong project!"
            exit 1
          fi

          echo "JR FakePlayer source structure verified."

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Verify JAR output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/verified
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} build/verified/ \;

          test -n "$(find build/verified -type f -name '*.jar')"

          echo "Built JAR files:"
          ls -lh build/verified

      - name: Upload JR FakePlayer JAR
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Forge-1.20.1
          path: build/verified/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Build-Logs
          path: |
            build/reports/**
            build/test-results/**
            build/logs/**
          if-no-files-found: ignore
          retention-days: 30
