
name: JR FakePlayer Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JR FakePlayer Forge 1.20.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Debug repository structure
        shell: bash
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la
          echo "===== PROJECT FILES =====
          "
          find . -maxdepth 3 -type f \
            \( -name build.gradle -o -name settings.gradle -o -name mods.toml \) \
            -print

      - name: Validate project
        shell: bash
        run: |
          set -eu

          if [ ! -f build.gradle ]; then
            echo "::error::build.gradle not found in repository root"
            exit 1
          fi

          if [ ! -f settings.gradle ]; then
            echo "::error::settings.gradle not found"
            exit 1
          fi

          if [ ! -d src/main/java ]; then
            echo "::error::src/main/java not found"
            exit 1
          fi

          echo "Project files validated."

      - name: Print Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build JR FakePlayer
        shell: bash
        run: |
          gradle clean build --no-daemon --stacktrace --info

      - name: Show build output
        if: always()
        shell: bash
        run: |
          echo "===== BUILD OUTPUT ====="
          if [ -d build/libs ]; then
            ls -lh build/libs
          else
            echo "build/libs does not exist"
          fi

      - name: Verify mod JAR
        shell: bash
        run: |
          set -eu

          if [ ! -d build/libs ]; then
            echo "::error::build/libs not found"
            exit 1
          fi

          mkdir -p verified

          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} verified/ \;

          if [ -z "$(find verified -type f -name '*.jar' -print -quit)" ]; then
            echo "::error::No mod JAR was generated"
            exit 1
          fi

          echo "Verified JAR:"
          ls -lh verified

      - name: Upload JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Forge-1.20.1
          path: verified/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Failure-Logs
          path: |
            build/reports/**
            build/test-results/**
            build/logs/**
          if-no-files-found: ignore
          retention-days: 30
