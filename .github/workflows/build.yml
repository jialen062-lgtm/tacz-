      - name: Locate Gradle project
        shell: bash
        run: |
          set -eu

          PROJECT_DIR=""

          if [ -f "./build.gradle" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="$(find . -mindepth 2 -maxdepth 5 \
              -type f -name build.gradle \
              ! -path './.gradle/*' \
              -print -quit | xargs dirname || true)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Cannot find build.gradle anywhere in repository"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "Gradle project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build JR FakePlayer
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"
          gradle clean build --no-daemon --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          mkdir -p verified

          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} verified/ \;

          test -n "$(find verified -name '*.jar' -print -quit)"
          ls -lh verified

      - name: Upload JR FakePlayer
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Forge-1.20.1
          path: ${{ env.PROJECT_DIR }}/verified/*.jar
          if-no-files-found: error
          retention-days: 30
