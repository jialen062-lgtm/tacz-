
name: JR FakePlayer Forge Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JR FakePlayer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java
          echo "Project structure OK"

      - name: Build Forge mod
        shell: bash
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JR-FakePlayer-Build-Reports
          path: |
            build/reports/**
            build/test-results/**
            build/logs/**
          if-no-files-found: ignore
          retention-days: 30
