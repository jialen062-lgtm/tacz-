
name: Tactical Spectator R5 Build

on:
  push:
    branches: [main, master]
    paths:
      - 'tactical_spectator_source_r5.zip'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 1.20.1 Mod (R5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Verify and extract R5 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="tactical_spectator_source_r5.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found: $SOURCE_ZIP"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          mkdir -p extracted-source
          unzip -q "$SOURCE_ZIP" -d extracted-source

          if [ ! -f extracted-source/build.gradle ]; then
            echo "ERROR: build.gradle not found"
            find extracted-source -maxdepth 5 -type f -print
            exit 1
          fi

      - name: Build mod
        working-directory: extracted-source
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-R5-JAR
          path: extracted-source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tactical-Spectator-R5-build-reports
          path: |
            extracted-source/build/reports/**
            extracted-source/build/test-results/**
          if-no-files-found: ignore
          retention-days: 30
