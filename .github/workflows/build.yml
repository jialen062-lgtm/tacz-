
name: Tactical Spectator Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect repository
        run: |
          echo "===== Repository files ====="
          ls -la
          echo "===== Gradle files ====="
          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*"

      - name: Locate and build Gradle project
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle build file found."
            echo "Please check repository source files."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found Gradle project: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tactical-Spectator-build
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 30
