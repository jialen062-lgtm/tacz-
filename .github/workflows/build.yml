
name: Build CopyBlock Forge 1.20.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'CopyBlock_Forge_1.20.1_source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build CopyBlock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source ZIP
        run: |
          set -euo pipefail

          if [ ! -f "CopyBlock_Forge_1.20.1_source.zip" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          echo "Source ZIP found."

      - name: Extract source ZIP
        run: |
          set -euo pipefail

          mkdir -p copyblock-source

          unzip -o CopyBlock_Forge_1.20.1_source.zip \
            -d copyblock-source

          echo "Source ZIP extracted."

      - name: Locate Gradle project
        id: locate
        run: |
          set -euo pipefail

          BUILD_FILE=$(find copyblock-source \
            -type f \
            -name build.gradle \
            -print \
            -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            find copyblock-source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project: $PROJECT_DIR"

      - name: Fix CopySessionData
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          FILE="src/main/java/com/blockforge/copyblock/data/CopySessionData.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: CopySessionData.java not found!"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/com/blockforge/copyblock/data/CopySessionData.java")
          source = path.read_text(encoding="utf-8")

          old = 'NbtUtils.readBlockState(BuiltInRegistries.BLOCK, tag.getCompound("Sample"));'

          new = """NbtUtils.readBlockState(
                      BuiltInRegistries.BLOCK.asLookup(),
                      tag.getCompound("Sample")
                  );"""

          if old in source:
              source = source.replace(old, new)
              path.write_text(source, encoding="utf-8")
              print("Fixed old readBlockState call.")
          elif "BuiltInRegistries.BLOCK.asLookup()" in source:
              print("Fix already present.")
          else:
              raise SystemExit("ERROR: Expected readBlockState call not found.")
          PY

          echo "Checking repaired source:"
          grep -n -A 3 "readBlockState" "$FILE"

      - name: Validate project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java

          echo "Project validation passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge mod
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          gradle --version

          gradle clean build --no-daemon

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CopyBlock-Forge-1.20.1
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
