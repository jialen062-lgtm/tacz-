
name: Tactical Spectator R6 Build

on:
  push:
    branches: [main, master]
    paths:
      - 'TacticalSpectator_R6_source_and_verification.zip'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and Build Forge 1.20.1 (R6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract R6 archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP='TacticalSpectator_R6_source_and_verification.zip'
          test -f "$ZIP" || {
            echo "Missing R6 ZIP at repository root"
            exit 1
          }
          mkdir -p r6
          unzip -q "$ZIP" -d r6
          test -f r6/build.gradle || {
            echo 'R6 build.gradle not found'
            exit 1
          }
          test -f r6/verification/run_checks.sh || {
            echo 'R6 verification scripts missing'
            exit 1
          }

      - name: Run R6 logic checks
        shell: bash
        run: bash r6/verification/run_checks.sh r6/src/main/java

      - name: Run mutation checks
        shell: bash
        run: bash r6/verification/mutation_check.sh r6/src/main/java

      - name: Build Forge mod
        working-directory: r6
        shell: bash
        run: gradle build --no-daemon

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-Spectator-R6-JAR
          path: r6/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-Spectator-R6-build-reports
          path: |
            r6/build/reports/**
            r6/build/test-results/**
            r6/build/logs/**
          if-no-files-found: ignore
          retention-days: 30
