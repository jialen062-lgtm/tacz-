
name: Build CopyBlock Forge 1.20.1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify Project Structure
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f src/main/resources/META-INF/mods.toml
          test -d src/main/java
          grep -q '1.20.1-47.4.10' build.gradle
          grep -q 'modId="copyblock"' src/main/resources/META-INF/mods.toml
          echo "CopyBlock project verification passed."

      - name: Build Forge Mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)

          test -n "$JAR"
          echo "Build output: $JAR"
          jar tf "$JAR" | grep -q 'CopyBlockMod.class'

      - name: Upload CopyBlock JAR
        uses: actions/upload-artifact@v4
        with:
          name: CopyBlock-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopyBlock-Build-Reports
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 30
