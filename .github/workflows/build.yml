
name: Build Minecraft Forge Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 自动寻找真正的 Gradle 工程
      - name: Locate Gradle Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 4 -type f | head -200

          BUILD_FILE=$(find . \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found."
            echo "Please check whether the source project exists."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project: $PROJECT_DIR"
          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 检查工程结构
      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory: $(pwd)"

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "WARNING: settings.gradle not found."
          fi

          if [ ! -d src/main ]; then
            echo "WARNING: src/main directory not found."
            echo "Project may use a different source layout."
          fi

          if [ ! -d src/main/java ]; then
            echo "WARNING: src/main/java not found."
          fi

          echo "Project inspection completed."

      # 检查 Java
      - name: Check Java
        run: |
          java -version
          gradle --version

      # 执行编译
      - name: Build Forge Mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle clean build \
            --no-daemon \
            --stacktrace

      # 检查编译产物
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR_DIR="$PROJECT_DIR/build/libs"

          if [ ! -d "$JAR_DIR" ]; then
            echo "ERROR: build/libs not found."
            exit 1
          fi

          echo "Generated JAR files:"
          find "$JAR_DIR" -maxdepth 1 -name '*.jar' -print

          if ! find "$JAR_DIR" -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' | grep -q .; then
            echo "ERROR: No usable JAR generated."
            exit 1
          fi

      # 上传模组
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Forge-Mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # 上传错误报告
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 30
