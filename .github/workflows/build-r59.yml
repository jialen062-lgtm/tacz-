
name: Build TACZYIGF r59

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r59-preview-ui-fix-source.zip'
      - '.github/workflows/build-r59.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q TACZYIGF-r59-preview-ui-fix-source.zip -d source

      - name: Locate project
        run: |
          BUILD_FILE=$(find source -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify attachment rules
        run: bash "$PROJECT_DIR/tools/verify-attachment-rules.sh"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r59
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            TACZYIGF-r59-preview-ui-fix-source.zip
          if-no-files-found: error
