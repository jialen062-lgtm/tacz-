
name: Build TACZYIGF r49

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取仓库文件
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. 自动寻找源码 ZIP
      - name: Find source ZIP
        run: |
          echo "当前仓库文件："
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname 'TACZYIGF-r49*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "错误：没有找到 TACZYIGF r49 源码 ZIP"
            exit 1
          fi

          echo "找到源码：$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. 解压源码
      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "源码解压完成"
          echo "源码目录结构："
          find source -maxdepth 4 -type f | head -n 100

      # 5. 自动寻找 Gradle 工程
      - name: Locate Gradle project
        run: |
          BUILD_FILE=$(find source -type f \
            -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "错误：找不到 build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "错误：找不到 settings.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle 工程位置：$PROJECT_DIR"

      # 6. 配置 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 7. 检查编译环境
      - name: Check build environment
        run: |
          java -version
          gradle --version
          ls -la "$PROJECT_DIR"

      # 8. 编译模组
      - name: Build mod
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean build

      # 9. 上传 JAR 文件
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r49
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
