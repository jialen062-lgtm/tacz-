
name: Build TACZYIGF r49

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r49
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
