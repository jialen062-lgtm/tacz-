
      - name: Auto Fix R63 Mixin Access
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("extracted-source")

          files = list(root.rglob("GunRefitScreenAttachmentsMixin.java"))

          if len(files) != 1:
              raise SystemExit(
                  f"Expected one target Java file, found {len(files)}"
              )

          source_file = files[0]
          source = source_file.read_text(encoding="utf-8")

          old = "screen.addRenderableWidget("
          count = source.count(old)

          if count != 5:
              raise SystemExit(
                  f"Expected 5 calls, found {count}. Stop to avoid wrong patch."
              )

          match = re.search(
              r"(?m)^package\s+([\w.]+)\s*;",
              source
          )

          if not match:
              raise SystemExit("Cannot detect Java package")

          package = match.group(1)

          invoker = f"""
          package {package};

          import net.minecraft.client.gui.components.Renderable;
          import net.minecraft.client.gui.components.events.GuiEventListener;
          import net.minecraft.client.gui.narration.NarratableEntry;
          import net.minecraft.client.gui.screens.Screen;

          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Invoker;

          @Mixin(Screen.class)
          public interface ScreenAddRenderableWidgetInvoker {{

              @Invoker("addRenderableWidget")
              <T extends GuiEventListener & Renderable & NarratableEntry>
              T taczcnpc$invokeAddRenderableWidget(T widget);
          }}
          """

          invoker_file = (
              source_file.parent /
              "ScreenAddRenderableWidgetInvoker.java"
          )

          invoker_file.write_text(invoker, encoding="utf-8")

          replacement = (
              "((ScreenAddRenderableWidgetInvoker) (Object) screen)"
              ".taczcnpc$invokeAddRenderableWidget("
          )

          source = source.replace(old, replacement)
          source_file.write_text(source, encoding="utf-8")

          configs = []

          for path in root.rglob("*.json"):
              if "mixin" not in path.name.lower():
                  continue

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8-sig")
                  )
              except Exception:
                  continue

              if isinstance(data, dict):
                  if data.get("package") == package:
                      configs.append((path, data))

          if len(configs) != 1:
              raise SystemExit(
                  f"Expected one matching Mixin config, found {len(configs)}"
              )

          config_path, config = configs[0]

          client = config.setdefault("client", [])

          if "ScreenAddRenderableWidgetInvoker" not in client:
              client.append("ScreenAddRenderableWidgetInvoker")

          config_path.write_text(
              json.dumps(data if False else config,
                         ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Successfully patched 5 widget calls")
          print("Invoker registered:", config_path)
          PY
