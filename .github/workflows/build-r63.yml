
name: Build TACZYIGF R63 - TaCZ Native Refit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract R63 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="TACZYIGF-R63-native-tacz-refit-source-and-workflow.zip"

          if [ -f "$ZIP_FILE" ]; then
            mkdir -p extracted-source
            unzip -oq "$ZIP_FILE" -d extracted-source
          else
            echo "::notice::R63 ZIP not found. Searching existing files."
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build R63
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --version
          gradle --no-daemon clean build

      - name: Collect JAR files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} release/ \;

          if [ -z "$(find release -name '*.jar' -print -quit)" ]; then
            echo "::error::No JAR files generated."
            exit 1
          fi

          ls -lh release/

      - name: Upload R63 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-R63-TaCZ-Native-Refit
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14
