name: Build TACZYIGF R63 - TaCZ Native Refit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'TACZYIGF-R63-native-tacz-refit-source-and-workflow.zip'
      - '.github/workflows/build-r63.yml'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile TACZYIGF R63
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract R63 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="TACZYIGF-R63-native-tacz-refit-source-and-workflow.zip"

          if [ -f "$ZIP_FILE" ]; then
            rm -rf extracted-source
            mkdir -p extracted-source
            unzip -oq "$ZIP_FILE" -d extracted-source
            echo "EXTRACTED_FROM_ZIP=true" >> "$GITHUB_ENV"
          else
            echo "EXTRACTED_FROM_ZIP=false" >> "$GITHUB_ENV"
            echo "::notice::R63 ZIP not found. Searching existing files."
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          if [ "${EXTRACTED_FROM_ZIP:-false}" = "true" ] && { [ -f "extracted-source/build.gradle" ] || [ -f "extracted-source/build.gradle.kts" ]; }; then
            PROJECT_DIR="extracted-source"
          else
            BUILD_FILE="$(find . \
              -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path './.git/*' \
              | head -n 1)"

            if [ -z "$BUILD_FILE" ]; then
              echo "::error::Gradle project not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Verify R63 native refit integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f build.gradle
          test -f settings.gradle
          test -f src/main/resources/mixins.tacz_cnpc_alert.json
          grep -q "version = '1.0.0-r63'" build.gradle
          grep -q 'GunRefitScreenAttachmentsMixin' src/main/resources/mixins.tacz_cnpc_alert.json
          test -f src/main/java/cn/blockforge/generated/taczcnpcalert/NativeRefitSessionService.java
          test -f src/main/java/cn/blockforge/generated/taczcnpcalert/mixin/GunRefitScreenAttachmentsMixin.java
          echo "R63 source identity and native refit integration verified"

      - name: Build R63
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon clean build --stacktrace

      - name: Collect JAR files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} release/ \;

          if [ -z "$(find release -name '*.jar' -print -quit)" ]; then
            echo "::error::No JAR files generated."
            exit 1
          fi

          ls -lh release/

      - name: Upload R63 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-R63-TaCZ-Native-Refit
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-R63-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/build/reports/**
            ${{ env.PROJECT_DIR }}/build/test-results/**
            ${{ env.PROJECT_DIR }}/build/logs/**
          if-no-files-found: ignore
          retention-days: 30
