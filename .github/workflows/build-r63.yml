
name: Build TACZYIGF R63 - TaCZ Native Refit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare R63 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="TACZYIGF-R63-native-tacz-refit-source-and-workflow.zip"

          if [ -f "$ZIP_FILE" ]; then
            echo "Found R63 source ZIP: $ZIP_FILE"
            mkdir -p extracted-source
            unzip -q "$ZIP_FILE" -d extracted-source
          fi

          echo "Searching for Gradle project..."

          BUILD_FILE="$(find . \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Cannot find build.gradle or build.gradle.kts"
            echo "Please put the R63 source ZIP in the repository root."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build R63
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Collect JAR files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} release/ \;

          if [ -z "$(find release -name '*.jar' -print -quit)" ]; then
            echo "::error::No JAR files found."
            exit 1
          fi

          ls -lh release/

      - name: Upload R63 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-R63-TaCZ-Native-Refit
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14
