
name: Build TACZYIGF r53 Video Modding Preview

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r53-video-mod-preview-source.zip'
      - '.github/workflows/build-r53.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract r53 source
        shell: bash
        run: |
          ZIP_FILE="TACZYIGF-r53-video-mod-preview-source.zip"
          test -f "$ZIP_FILE" || {
            echo "找不到源码 ZIP：$ZIP_FILE"
            ls -la
            exit 1
          }
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Locate Gradle project
        shell: bash
        run: |
          BUILD_FILE=$(find source -name build.gradle -print -quit)
          test -n "$BUILD_FILE" || {
            echo "找不到 build.gradle"
            exit 1
          }
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r53-video-mod-preview
          path: source/**/build/libs/*.jar
          if-no-files-found: error
