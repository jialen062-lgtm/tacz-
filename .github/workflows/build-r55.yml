
name: Build TACZYIGF r55 Preview Orientation Fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r55-preview-orientation-fix-source.zip'
      - '.github/workflows/build-r55.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract r55 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TACZYIGF-r55-preview-orientation-fix-source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "找不到源码文件：$ZIP_FILE"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find source -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "找不到 build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r55-preview-orientation-fix
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
