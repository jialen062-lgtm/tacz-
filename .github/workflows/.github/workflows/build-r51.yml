
name: Build TACZYIGF r51

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r51*.zip'
      - '.github/workflows/build-r51.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract r51 source ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'TACZYIGF-r51*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 r51 源码 ZIP 文件"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Locate Gradle project
        shell: bash
        run: |
          BUILD_FILE=$(find source -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "找不到 build.gradle"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r51-build
          path: source/**/build/libs/*.jar
          if-no-files-found: error
