
name: Build TACZYIGF r50 Final Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir source
          ZIP_FILE="TACZYIGF-r50-final-preview-fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "找不到源码 ZIP"
            ls -la
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

      - name: Locate Gradle project
        run: |
          BUILD_FILE=$(find source -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "找不到 build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r50-final-fix
          path: source/**/build/libs/*.jar
          if-no-files-found: error
