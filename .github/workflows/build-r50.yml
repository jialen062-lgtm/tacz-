
name: Build TACZYIGF r50

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract r50 source ZIP
        run: |
          mkdir source
          unzip -q "TACZYIGF-r50-player-preview-update.zip" -d source
          find source -name build.gradle -print

      - name: Locate Gradle project
        run: |
          BUILD_FILE=$(find source -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "找不到 build.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r50
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
