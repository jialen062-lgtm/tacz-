
name: Build TACZYIGF R62

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract R62 source
        run: |
          mkdir -p extracted
          unzip -q TACZYIGF-R62-source-and-workflow.zip -d extracted

      - name: Locate Gradle project
        run: |
          PROJECT_FILE=$(find extracted -type f -name build.gradle -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build R62
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Upload R62 JAR
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-R62
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
