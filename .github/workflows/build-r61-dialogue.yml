
name: Build TACZYIGF r61 Dialogue Stage 1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r61-dialogue-stage1.zip'
      - '.github/workflows/build-r61-dialogue.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          set -euo pipefail
          test -s TACZYIGF-r61-dialogue-stage1.zip
          mkdir -p source
          unzip -q TACZYIGF-r61-dialogue-stage1.zip -d source

      - name: Locate Gradle project
        run: |
          set -euo pipefail
          BUILD_FILE=$(find source -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Verify JAR
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/build/libs" -name '*.jar' -type f
          JAR=$(find "$PROJECT_DIR/build/libs" -name '*.jar' -type f | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" >/dev/null

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r61-dialogue-stage1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            TACZYIGF-r61-dialogue-stage1.zip
          if-no-files-found: error
          retention-days: 30
