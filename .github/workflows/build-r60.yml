
name: Build TACZYIGF r60

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r60-source-1.zip'
      - '.github/workflows/build-r60.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TACZYIGF-r60-source-1.zip"
          test -s "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE=$(find extracted -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "错误：ZIP 中没有找到 build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "找到项目：$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build r60
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} verified/ \;

          if [ -z "$(find verified -name '*.jar' -print -quit)" ]; then
            echo "错误：没有生成 JAR 文件"
            exit 1
          fi

          for JAR in verified/*.jar; do
            jar tf "$JAR" >/dev/null
            echo "验证成功：$JAR"
          done

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r60
          path: verified/*.jar
          if-no-files-found: error
          retention-days: 30
