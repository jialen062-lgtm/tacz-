
name: Build TACZYIGF r60

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TACZYIGF-r60-source.zip'
      - '.github/workflows/build-r60.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          test -s TACZYIGF-r60-source.zip
          mkdir -p extracted
          unzip -q TACZYIGF-r60-source.zip -d extracted

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE=$(find extracted -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          grep -F "version = '1.0.0-r60'" "$BUILD_FILE"

      - name: Verify attachment rules
        run: bash "$PROJECT_DIR/tools/verify-attachment-rules.sh"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build r60
        run: gradle --no-daemon -p "$PROJECT_DIR" clean build

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$PROJECT_DIR/build/libs/tacz_cnpc_alert-1.0.0-r60.jar"
          test -s "$JAR"
          jar tf "$JAR" >/dev/null
          echo "JAR verification passed"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TACZYIGF-r60
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            TACZYIGF-r60-source.zip
          if-no-files-found: error
          retention-days: 30
1
